{% extends "panel/entrada_base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<h1 style="font-size:1.2rem">Cambiar contraseña</h1>
<p class="ayuda" style="margin:0">Te enviamos un enlace para elegir una nueva.</p>
<form method="post" class="formulario">
	{% include "panel/_csrf.html" %}
	<div class="campo"><label for="email">Correo</label><input id="email" name="email" type="email" required autofocus></div>
	<button class="boton">Enviar enlace</button>
	<a href="{{ url_for('panel.entrar') }}">Volver</a>
</form>
{% endblock %}
