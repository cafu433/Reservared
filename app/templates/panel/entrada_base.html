<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Entrar{% endblock %} · Reservared</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
</head>
<body class="entrada">
<div class="entrada__caja">
	<div class="marca"><span class="marca__punto" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="4" cy="4" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="8" cy="12" r="1.6"/><path d="M5.4 4.6 7 10.6M10.6 4.6 9 10.6M5.6 4h4.8"/></svg></span>Reservared</div>
	{% with mensajes = get_flashed_messages(with_categories=true) %}
		{% for cat, m in mensajes %}<p class="aviso aviso--{{ cat }}">{{ m }}</p>{% endfor %}
	{% endwith %}
	{% block contenido %}{% endblock %}
</div>
</body>
</html>
