{% extends "panel/base.html" %}
{% block titulo %}Nueva cita{% endblock %}
{% block contenido %}
<div class="cabecera"><div><h1>Nueva cita</h1><p class="cabecera__sub">Para una hora tomada por teléfono, WhatsApp o en persona.</p></div></div>
<form method="post" class="hoja formulario" style="max-width:900px">
	{% include "panel/_csrf.html" %}
	<div class="rejilla-form">
		<div class="campo"><label for="servicio_id">Servicio</label>
			<select id="servicio_id" name="servicio_id" required>{% for s in servicios %}<option value="{{ s.id }}" {{ 'selected' if d.servicio_id == s.id|string }}>{{ s.nombre }} ({{ s.duracion }} min){{ ' · online' if s.online }}{{ ' · inactivo' if not s.activo }}</option>{% endfor %}</select></div>
		{% if current_user.es_admin %}
		<div class="campo"><label for="profesional_id">Profesional</label>
			<select id="profesional_id" name="profesional_id" required><option value="">Elegir…</option>{% for p in visibles %}<option value="{{ p.id }}" {{ 'selected' if d.profesional_id == p.id|string }}>{{ p.nombre }}</option>{% endfor %}</select></div>
		{% endif %}
		<div class="campo"><label for="fecha">Día</label><input id="fecha" type="date" name="fecha" required value="{{ d.fecha }}"></div>
		<div class="campo"><label for="hora">Hora</label><input id="hora" type="time" name="hora" step="300" required value="{{ d.hora }}"></div>
		<div class="campo"><label for="nombre">Nombre del paciente</label><input id="nombre" name="nombre" required value="{{ d.nombre or '' }}"></div>
		<div class="campo"><label for="rut">RUT <small>opcional</small></label><input id="rut" name="rut" value="{{ d.rut or '' }}" placeholder="12.345.678-5"></div>
		<div class="campo"><label for="email">Correo</label><input id="email" type="email" name="email" required value="{{ d.email or '' }}"></div>
		<div class="campo"><label for="telefono">Teléfono</label><input id="telefono" type="tel" name="telefono" value="{{ d.telefono or '' }}"></div>
		<div class="campo"><label for="estado">Estado</label>
			<select id="estado" name="estado">{% for k, v in ESTADOS.items() %}<option value="{{ k }}" {{ 'selected' if d.estado == k }}>{{ v }}</option>{% endfor %}</select></div>
		<div class="campo ancho"><label for="notas">Comentario del paciente</label><textarea id="notas" name="notas" rows="2">{{ d.notas or '' }}</textarea></div>
		<label class="check ancho"><input type="checkbox" name="avisar" value="1" {{ 'checked' if d.avisar }}> Enviar la confirmación por correo al paciente (con el enlace de la sesión si es online)</label>
	</div>
	<div class="acciones"><button class="boton">Guardar cita</button><a href="{{ url_for('panel.agenda') }}">Cancelar</a></div>
</form>
{% endblock %}
