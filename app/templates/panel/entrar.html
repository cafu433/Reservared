{% extends "panel/entrada_base.html" %}
{% block contenido %}
<p class="ayuda" style="margin:0">Agenda de {{ negocio }}</p>
<form method="post" class="formulario">
	{% include "panel/_csrf.html" %}
	<div class="campo"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
	<div class="campo"><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" autocomplete="current-password" required></div>
	<button class="boton">Entrar</button>
	<a href="{{ url_for('panel.olvide') }}">Olvidé mi contraseña</a>
</form>
{% endblock %}
